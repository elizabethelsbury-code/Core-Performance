<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training Ledger">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17181A">
<title>Training Ledger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#17181A; --surface:#1F2023; --surface-2:#26282C;
  --text:#ECE8E1; --text-dim:#98968F; --text-faint:#67655F;
  --brass:#C49A45; --brass-dim:#5E4E2C;
  --rust:#C15C33; --rust-dim:#4A2A1C;
  --sage:#8A9A79; --sage-dim:#33392C;
  --steel:#6E93AC; --steel-dim:#2A3A45;
  --border:#333438;
  --font-display:'Oswald',sans-serif; --font-body:'Inter',-apple-system,sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;padding-bottom:78px;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.02em;margin:0;}
.eyebrow{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-faint);}

header{padding:20px 18px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:20;}
.brandrow{display:flex;align-items:center;justify-content:space-between;}
.brand{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:0.05em;}
.brand span{color:var(--brass);}
.gearbtn{background:none;border:1px solid var(--border);color:var(--text-dim);width:32px;height:32px;border-radius:8px;font-size:14px;display:flex;align-items:center;justify-content:center;}
.gearbtn:active{background:var(--surface-2);}
.headerbtns{display:flex;gap:8px;}
.phaseline{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;margin-bottom:10px;}
.phaseline .week{font-family:var(--font-display);font-weight:700;font-size:22px;}
.phaseline .phase{font-family:var(--font-mono);font-weight:600;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;padding:4px 10px;border-radius:5px;}
.phase.build{background:var(--brass-dim);color:var(--brass);}
.phase.deload{background:var(--sage-dim);color:var(--sage);}
.phase.peak{background:var(--rust-dim);color:var(--rust);}
.phase.consolidate,.phase.complete{background:var(--surface-2);color:var(--text-dim);}
.plates{display:flex;gap:3px;margin-bottom:2px;}
.plate{flex:1;height:8px;border-radius:2px;background:var(--surface-2);border:1px solid var(--border);}
.plate.done{background:var(--brass);border-color:var(--brass);}
.plate.deload-mark{border-color:var(--sage);}
.plate.current{outline:2px solid var(--rust);outline-offset:1px;}

main{padding:16px 18px 20px;max-width:520px;margin:0 auto;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.section-label{font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;color:var(--text-faint);text-transform:uppercase;margin-bottom:8px;}

/* bottom nav */
.navbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--border);z-index:30;padding-bottom:env(safe-area-inset-bottom);}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;background:none;border:none;color:var(--text-faint);font-family:var(--font-mono);font-size:9px;letter-spacing:0.04em;text-transform:uppercase;}
.navbtn.active{color:var(--brass);}
.navbtn .ic{font-size:16px;line-height:1;}

/* form controls */
input,select,textarea{font-family:var(--font-body);}
.field label{display:block;font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;font-family:var(--font-mono);}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px 10px;font-size:14px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brass);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.pill{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.04em;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);text-transform:uppercase;}
.pill.active{background:var(--brass);border-color:var(--brass);color:#1B1600;}

.herobadge{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.05em;background:var(--rust-dim);color:var(--rust);padding:3px 7px;border-radius:5px;text-transform:uppercase;}
.accbadge{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.05em;background:var(--surface-2);color:var(--text-faint);padding:3px 7px;border-radius:5px;text-transform:uppercase;}

.setrow{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.setrow .idx{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:14px;}
.setrow input{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 8px;font-size:13px;font-family:var(--font-mono);}
.setrow .w{width:58px;} .setrow .r{width:50px;}
.setrow select{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:7px 4px;font-size:11px;font-family:var(--font-mono);}
.setrow .n{flex:1;min-width:0;font-family:var(--font-body);font-size:12px;}
.setrow button{background:none;border:none;color:var(--text-faint);font-size:13px;padding:2px;}
.addset{font-family:var(--font-mono);font-size:11px;color:var(--steel);background:none;border:none;padding:2px 0;margin-top:2px;}

.savebar{position:fixed;bottom:58px;left:0;right:0;padding:10px 18px;background:linear-gradient(to top,var(--bg) 65%,transparent);z-index:25;}
.savebtn{width:100%;max-width:520px;margin:0 auto;display:block;background:var(--brass);color:#1B1600;border:none;border-radius:10px;padding:13px;font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:0.05em;text-transform:uppercase;}
.savebtn.saved{background:var(--sage);}

.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--brass);color:var(--text);padding:9px 16px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity 0.25s;pointer-events:none;}
.toast.show{opacity:1;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:flex-end;z-index:50;}
.overlay.show{display:flex;}
.sheet{background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;padding:20px 18px 28px;width:100%;max-height:82vh;overflow-y:auto;}
.sheet h3{font-size:16px;margin-bottom:6px;}
.sheet p{color:var(--text-dim);font-size:13px;line-height:1.5;margin:0 0 14px;}
.sheetbtns{display:flex;gap:10px;margin-top:14px;}
.sheetbtns button{flex:1;font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;padding:12px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);}
.sheetbtns button.primary{background:var(--brass);border-color:var(--brass);color:#1B1600;}

.histhead{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;padding:0;color:inherit;text-align:left;}
.histdate{font-family:var(--font-mono);font-size:11px;color:var(--brass);}
.histlabel{font-family:var(--font-display);font-weight:600;font-size:15px;}
.histbody{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:none;}
.histbody.show{display:block;}
.exname{font-family:var(--font-display);font-weight:500;font-size:13px;margin-bottom:4px;}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:4px 8px;font-family:var(--font-mono);font-size:11px;color:var(--text);}
.histactions{display:flex;gap:14px;margin-top:8px;}
.histactions button{background:none;border:none;font-family:var(--font-mono);font-size:11px;letter-spacing:0.03em;}

.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;}
.stat .l{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-transform:uppercase;}
.stat .v{font-family:var(--font-mono);font-size:22px;font-weight:600;margin-top:2px;}

.chartwrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
.chartwrap svg{width:100%;height:auto;display:block;}
.chartempty{color:var(--text-faint);font-size:12px;text-align:center;padding:30px 0;font-family:var(--font-body);}
.liftheader{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.liftname{font-family:var(--font-display);font-weight:600;font-size:16px;}
.liftnote{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);}
.liftvalue{font-family:var(--font-mono);font-size:19px;font-weight:600;text-align:right;}
.liftdelta{font-family:var(--font-mono);font-size:10px;text-align:right;}

.proglist{display:flex;flex-direction:column;gap:6px;}
.progrow{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;}
.progrow .wk{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);}
.progrow .ph{font-family:var(--font-display);font-weight:500;font-size:14px;}
.rulerow{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:8px;}
.rulerow .n{color:var(--brass);font-family:var(--font-mono);font-size:12px;flex-shrink:0;}
.rulerow .t{font-size:13px;line-height:1.4;}

.emptystate{text-align:center;padding:40px 0;color:var(--text-faint);font-size:13px;}
</style>
</head>
<body>

<header>
  <div class="brandrow">
    <div class="brand">TRAINING <span>LEDGER</span></div>
    <div class="headerbtns">
      <button class="gearbtn" id="settingsBtn" aria-label="Settings">&#9881;</button>
    </div>
  </div>
  <div class="phaseline" id="phaseline"></div>
  <div class="plates" id="plates"></div>
</header>

<main id="mainContent"></main>

<div class="navbar" id="navbar"></div>

<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <h3>Program start date</h3>
    <p>Week and phase are calculated from this date. Set to when you actually began the 12-week block.</p>
    <input type="date" id="startDateInput" style="width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:11px;font-size:15px;margin-bottom:16px;">
    <div class="sheetbtns">
      <button id="cancelSettings">Cancel</button>
      <button class="primary" id="saveSettings">Save</button>
    </div>
    <div style="border-top:1px solid var(--border);margin-top:20px;padding-top:16px;">
      <h3 style="font-size:14px;">Reset data</h3>
      <p>Clears everything saved on this device, including your imported training history. Can't be undone.</p>
      <div class="sheetbtns">
        <button id="confirmReset" style="background:var(--rust);border-color:var(--rust);color:#fff;width:100%;">Reset app</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
window.DEFAULT_PLAN = {
  Monday:   { label:'Rest day', type:'rest', desc:'Tap Edit Program to set up your week.' },
  Tuesday:  { label:'Rest day', type:'rest', desc:'Tap Edit Program to set up your week.' },
  Wednesday:{ label:'Rest day', type:'rest', desc:'Tap Edit Program to set up your week.' },
  Thursday: { label:'Rest day', type:'rest', desc:'Tap Edit Program to set up your week.' },
  Friday:   { label:'Rest day', type:'rest', desc:'Tap Edit Program to set up your week.' },
  Saturday: { label:'Rest day', type:'rest', desc:'Tap Edit Program to set up your week.' },
  Sunday:   { label:'Rest day', type:'rest', desc:'Tap Edit Program to set up your week.' },
};
window.DAY_ORDER = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
</script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
